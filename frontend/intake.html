<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Intake - Robert Case & Partners Advocates</title>
    <style>
        .banner {
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            display: none;
        }
        .banner-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .banner-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Client Intake Form</h2>

        <!-- UI Feedback Banners -->
        <div id="error-banner" class="banner banner-danger"></div>
        <div id="success-banner" class="banner banner-success"></div>

        <form id="intake-form">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" required placeholder="+254 700 000 000">
            </div>

            <div class="form-group">
                <label for="service_required">Service Required</label>
                <input type="text" id="service_required" name="service_required" required placeholder="e.g. Property Law / Civil Litigation">
            </div>

            <div class="form-group">
                <label for="case_summary">Case Summary</label>
                <textarea id="case_summary" name="case_summary" rows="5" required placeholder="Brief description of your case..."></textarea>
            </div>

            <button type="submit" id="submit-btn">Submit Intake</button>
        </form>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const intakeForm = document.getElementById('intake-form');
    const errorBanner = document.getElementById('error-banner');
    const successBanner = document.getElementById('success-banner');
    const submitBtn = document.getElementById('submit-btn');

    if (!intakeForm) return;

    intakeForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // 1. Reset visual banner states on new submission
        if (errorBanner) {
            errorBanner.style.display = 'none';
            errorBanner.innerText = '';
        }
        if (successBanner) {
            successBanner.style.display = 'none';
            successBanner.innerText = '';
        }

        // Disable button during network call
        if (submitBtn) submitBtn.disabled = true;

        const payload = {
            full_name: document.getElementById('full_name')?.value || "",
            email: document.getElementById('email')?.value || "",
            phone: document.getElementById('phone')?.value || "",
            service_required: document.getElementById('service_required')?.value || "",
            case_summary: document.getElementById('case_summary')?.value || ""
        };

        try {
            const response = await fetch('/api/intake', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                if (successBanner) {
                    successBanner.innerText = data.message || "Intake form submitted successfully!";
                    successBanner.style.display = 'block';
                } else {
                    alert("Intake form submitted successfully!");
                }
                intakeForm.reset();
            } else {
                const errorMsg = data.detail || "Server rejected submission. Please check your inputs.";
                if (errorBanner) {
                    errorBanner.innerText = errorMsg;
                    errorBanner.style.display = 'block';
                } else {
                    alert(errorMsg);
                }
            }
        } catch (err) {
            const netErrorMsg = "Error transmitting data. Ensure your API server is active.";
            if (errorBanner) {
                errorBanner.innerText = netErrorMsg;
                errorBanner.style.display = 'block';
            } else {
                alert(netErrorMsg);
            }
        } finally {
            if (submitBtn) submitBtn.disabled = false;
        }
    });
});
</script>
</body>
</html>
