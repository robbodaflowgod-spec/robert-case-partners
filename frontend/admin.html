<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Robert Case & Partners</title>

    <!-- Immediate Client-Side Security Guard (Executes before DOM renders) -->
    <script>
        (function () {
            const token = localStorage.getItem('adminToken') || localStorage.getItem('access_token') || localStorage.getItem('userToken');
            if (!token) {
                window.location.replace('login.html');
            }
        })();
    </script>

    <style>
        :root {
            --primary: #0f172a;
            --accent: #b45309;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 2rem; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 2px solid var(--border); }
        h1 { color: var(--primary); font-size: 1.75rem; }
        .logout-btn { background-color: #64748b; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 0.5rem; }
        .logout-btn:hover { background-color: #475569; }
        .refresh-btn { background-color: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .refresh-btn:hover { background-color: #1e293b; }
        .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: var(--card-bg); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); }
        .stat-card h3 { font-size: 0.875rem; text-transform: uppercase; color: #64748b; margin-bottom: 0.5rem; }
        .stat-card p { font-size: 1.75rem; font-weight: bold; color: var(--primary); }

        .table-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #f1f5f9; color: var(--primary); font-weight: 600; padding: 1rem; border-bottom: 2px solid var(--border); }
        td { padding: 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 0.95rem; }
        
        .status-badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-pending { background-color: #fef3c7; color: #d97706; }
        .status-reviewed { background-color: #dcfce7; color: #15803d; }
        
        .service-tag { background-color: #e2e8f0; color: #334155; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .no-data { text-align: center; padding: 3rem; color: #94a3b8; }

        .action-btn { background-color: #c25e00; color: white; border: none; padding: 0.45rem 0.85rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .action-btn:hover { background-color: #a04c00; }
        .action-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .done-text { color: #15803d; font-weight: 600; font-size: 0.85rem; }

        /* Modal styling */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #fff; padding: 1.5rem; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .modal h3 { margin-bottom: 1rem; color: var(--primary); }
        .modal label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 0.5rem; color: #475569; }
        .modal input { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 1.25rem; font-size: 0.9rem; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
        .btn-cancel { background: #e2e8f0; color: #334155; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-confirm { background: #c25e00; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Robert Case & Partners</h1>
            <p style="color: #64748b; margin-top: 0.25rem;">Legal Consultation Requests Pipeline</p>
        </div>
        <div>
            <button class="logout-btn" onclick="logout()">Logout</button>
            <button class="refresh-btn" id="refresh-btn" onclick="fetchIntakes()">Refresh Data</button>
        </div>
    </header>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Intake Requests</h3>
            <p id="stat-total">0</p>
        </div>
        <div class="stat-card">
            <h3>Pending Review</h3>
            <p id="stat-pending" style="color: #d97706;">0</p>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Client Details</th>
                    <th>Service Required</th>
                    <th>Case Summary</th>
                    <th>Date Submitted</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="intake-rows"></tbody>
        </table>
        <div id="loading-state" class="no-data">Loading application entries...</div>
    </div>

    <!-- Review & Invite Modal -->
    <div class="modal-overlay" id="review-modal">
        <div class="modal">
            <h3>Review Consultation</h3>
            <p id="modal-client-info" style="font-size: 0.85rem; color: #64748b; margin-bottom: 1rem;"></p>
            <label for="meetup-date">Proposed Physical Meetup Date & Time</label>
            <input type="datetime-local" id="meetup-date">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-confirm" id="modal-submit-btn" onclick="submitReview()">Mark Reviewed & Email Client</button>
            </div>
        </div>
    </div>

    <script>
        let selectedIntakeId = null;

        function getToken() {
            return localStorage.getItem('adminToken') || localStorage.getItem('access_token') || localStorage.getItem('userToken');
        }

        function clearAuthAndRedirect() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('access_token');
            localStorage.removeItem('userToken');
            localStorage.removeItem('role');
            localStorage.removeItem('is_admin');
            window.location.replace('login.html');
        }

        const API_URL = "/api/admin/intakes";

        async function fetchIntakes() {
            const rowContainer = document.getElementById("intake-rows");
            const loadingState = document.getElementById("loading-state");
            const refreshBtn = document.getElementById("refresh-btn");
            const activeToken = getToken();

            if (!activeToken) {
                clearAuthAndRedirect();
                return;
            }

            refreshBtn.disabled = true;
            refreshBtn.innerText = "Refreshing...";
            
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${activeToken}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    clearAuthAndRedirect();
                    return;
                }

                if (!response.ok) throw new Error(`Server returned ${response.status}`);

                const data = await response.json();
                rowContainer.innerHTML = "";
                
                if (!data || data.length === 0) {
                    loadingState.style.display = "block";
                    loadingState.innerText = "No intake submissions found in the database.";
                    document.getElementById("stat-total").innerText = "0";
                    document.getElementById("stat-pending").innerText = "0";
                    return;
                }
                
                loadingState.style.display = "none";
                let pendingCount = 0;

                data.forEach(item => {
                    const status = item.status || "pending";
                    if (status === "pending") pendingCount++;
                    
                    const isPending = status === "pending";
                    const badgeClass = isPending ? "status-pending" : "status-reviewed";

                    const formattedDate = item.created_at 
                        ? new Date(item.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
                        : 'N/A';

                    const actionHTML = isPending
                        ? `<button class="action-btn" onclick="openReviewModal('${item.id}', '${escapeQuotes(item.full_name)}')">Review & Notify</button>`
                        : `<span class="done-text">✓ Email Sent</span>`;

                    const rowHTML = `
                        <tr>
                            <td>
                                <strong>${item.full_name || 'Anonymous'}</strong><br>
                                <small style="color:#64748b">${item.email || 'No email'}</small><br>
                                <small style="color:#0f172a">${item.phone || 'No phone'}</small>
                            </td>
                            <td><span class="service-tag">${item.service_required || 'General Legal'}</span></td>
                            <td style="max-width: 250px; word-wrap: break-word;">${item.case_summary || 'No summary provided.'}</td>
                            <td><small style="color:#64748b">${formattedDate}</small></td>
                            <td><span class="status-badge ${badgeClass}">${status}</span></td>
                            <td>${actionHTML}</td>
                        </tr>
                    `;
                    rowContainer.insertAdjacentHTML("beforeend", rowHTML);
                });

                document.getElementById("stat-total").innerText = data.length;
                document.getElementById("stat-pending").innerText = pendingCount;

            } catch (error) {
                loadingState.style.display = "block";
                loadingState.innerText = "Error connecting to backend services.";
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.innerText = "Refresh Data";
            }
        }

        function escapeQuotes(str) {
            return (str || '').replace(/'/g, "\\'");
        }

        function openReviewModal(id, clientName) {
            selectedIntakeId = id;
            document.getElementById("modal-client-info").innerText = `Client: ${clientName}`;
            document.getElementById("meetup-date").value = "";
            document.getElementById("review-modal").style.display = "flex";
        }

        function closeModal() {
            selectedIntakeId = null;
            document.getElementById("review-modal").style.display = "none";
        }

        async function submitReview() {
            if (!selectedIntakeId) return;

            const meetupDate = document.getElementById("meetup-date").value;
            const submitBtn = document.getElementById("modal-submit-btn");
            const activeToken = getToken();

            submitBtn.disabled = true;
            submitBtn.innerText = "Updating & Sending Email...";

            try {
                const response = await fetch(`/api/admin/intakes/${selectedIntakeId}/review`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${activeToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'reviewed',
                        meetup_date: meetupDate || null
                    })
                });

                if (response.ok) {
                    closeModal();
                    await fetchIntakes();
                } else {
                    const err = await response.json();
                    alert(err.detail || "Failed to update review status.");
                }
            } catch (error) {
                alert("Network error updating intake request.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Mark Reviewed & Email Client";
            }
        }

        function logout() {
            clearAuthAndRedirect();
        }

        window.onload = fetchIntakes;
    </script>
</body>
</html>
